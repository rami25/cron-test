name: Scheduled Task Cron

on:
  schedule:
    # Runs every 1 minute
    - cron: '*/5 * * * *'
  
  # Allows you to trigger it manually from the Actions tab
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python environment (cache removed to prevent requirements.txt errors)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies (uncomment and add a requirements.txt if you install external packages later)
      # - name: Install dependencies
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install -r requirements.txt

      # 4. Run your Python script (change 'task.py' if it's located inside a folder)
      - name: Run Python script
        run: python task.py
