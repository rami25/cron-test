name: Scheduled Task Cron

on:
  schedule:
    # Runs every day at 8:00 AM UTC
    # You can change this using standard cron syntax (UTC time)
    # - cron: '0 8 * * *'
    - cron: '*/5 * * * *'
  
  # Allows you to also trigger it manually from the GitHub Actions tab if needed
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # optional: caches dependencies if you have a requirements.txt

      # 3. Install dependencies (if you have any)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run your script
      - name: Run Python script
        run: python task.py
        
        # If your script requires environment variables (like API keys or DB URLs), 
        # pass them securely using GitHub Secrets:
        # env:
        #   MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}
